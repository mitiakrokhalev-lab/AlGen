name: claude mine

# Перепись объёма выдачи базы: ALGEN_CENSUS=1 — каждая схема только перебирается
# и минимизируется (без вердиктов); итог — число минимальных условий, время и
# память на схему. Это не результаты схем (статус «перепись»).
# Запуск: пуш в ветку claude-census-*; параметры — в .github/claude-mine.json.

on:
  push:
    branches: ["claude-mine-*"]

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      source: ${{ steps.p.outputs.source }}
      base: ${{ steps.p.outputs.base }}
      n: ${{ steps.p.outputs.n }}
      limit: ${{ steps.p.outputs.limit }}
      ref: ${{ steps.p.outputs.ref }}
      k: ${{ steps.p.outputs.k }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path('.github/claude-mine.json').read_text())
          assert c['base'] == 'G' and 1 <= c['parts'] <= 20 and type(c['source_run']) is int
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('parts=' + json.dumps(list(range(1, c['parts'] + 1))) + '\n')
              f.write(f"source={c['source_run']}\nbase={c['base']}\nn={c['parts']}\nlimit={c['seconds_per_scheme']}\n")
              f.write(f"ref={c['ref']}\nk={c['k']}\n")
          print(c)
          PY

  part:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      ALGEN_SIZE: "2"
      ALGEN_FAST: "1"
      ALGEN_SAMPLE: "200000"
      ALGEN_SAMPLE_EXAMPLES: "5000"
      ALGEN_EXAMPLE_MIN_SUPPORT: "50"
      ALGEN_COMPRESS: ""
      ALGEN_SKEL: ${{ github.workspace }}/native/skel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/checkout@v4
        with:
          path: pilot-control
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy python-sat pyyaml
      - uses: actions/download-artifact@v4
        with: {name: skel, path: native, run-id: "${{ needs.plan.outputs.source }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: tabs, path: native-tabs, run-id: "${{ needs.plan.outputs.source }}", github-token: "${{ github.token }}"}
      - name: Входы
        run: |
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          plan = json.loads(Path('pilot-control/.github/stress-plan.json').read_text())
          for rel, want in plan['input_files_sha256'].items():
              with Path(rel).open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == want, rel
          print('входы ok')
          PY
          mv native/кэш кэш
          git rev-parse HEAD > commit.txt
      - name: Перепись части
        continue-on-error: true
        working-directory: py
        run: |
          /usr/bin/time -v timeout 320m python3 -B -m algen.table перебор ${{ needs.plan.outputs.base }} \
            --каталог ../native-tabs --выход ../out --часть ${{ matrix.part }}/${{ needs.plan.outputs.n }} \
            --нитей 1 --посылок ${{ needs.plan.outputs.k }} --предел ${{ needs.plan.outputs.limit }} 2> ../time-${{ matrix.part }}.txt
          tail -25 ../time-${{ matrix.part }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-${{ matrix.part }}
          path: |
            out/*.json
            time-*.txt
            commit.txt
          retention-days: 90

  summary:
    needs: [plan, part]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: census-*
          path: parts
      - name: Сводка кандидатов
        run: |
          python3 -B - <<'PY'
          import json, glob
          from pathlib import Path
          out, schemes = [], 0
          for f in glob.glob('parts/**/G-*.json', recursive=True):
              r = json.loads(Path(f).read_text())
              c = r.get('перепись') or {}
              schemes += 1
              for e in c.get('примеры', []):
                  e['схема'] = r['id']; out.append(e)
          out.sort(key=lambda e: -e['строк с посылками'])
          Path('census.json').write_text(json.dumps({'схем': schemes, 'кандидатов': len(out), 'кандидаты': out}, ensure_ascii=False, indent=0))
          print(schemes, len(out))
          PY
      - name: Результаты в ветку results-<ветка>
        run: |
          tar czf census-parts.tar.gz parts || true
          git config user.name "algen-bot"
          git config user.email "algen-bot@users.noreply.github.com"
          git checkout --orphan "results-${GITHUB_REF_NAME}"
          git rm -rq --cached . && git clean -fdq -e census.json -e census-parts.tar.gz
          git add census.json census-parts.tar.gz
          git commit -qm "Перепись ${GITHUB_REF_NAME}, запуск ${GITHUB_RUN_ID}"
          git push -f origin "HEAD:refs/heads/results-${GITHUB_REF_NAME}"
